name: Dependency vulnerability scan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    # Re-scan the locked dependency graph after advisory databases change,
    # even when the repository itself has not received a commit.
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-current-lockfiles:
    name: Scan current dependency graph
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # OSV-Scanner reusable workflow pinned to an immutable reviewed revision.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d
    with:
      scan-args: |-
        --recursive
        ./

  scan-pull-request-delta:
    name: Reject newly introduced vulnerabilities
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    # OSV-Scanner reusable workflow pinned to an immutable reviewed revision.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@ffa0a5f39214d80778c9b494822d94d0d9668458
    with:
      scan-args: |-
        --recursive
        ./
